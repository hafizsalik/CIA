<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174f43"><title>CIA | دفتر حساب و کتاب</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
:root{--green:#174f43;--green2:#246b57;--gold:#b58a45;--bg:#f4f7f5;--surface:#fff;--text:#182522;--muted:#7c8984;--line:#e8eeea;--red:#c45e58;--shadow:0 10px 30px rgba(26,65,52,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh;padding:26px 30px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px;box-shadow:0 7px 18px #174f4330}.brand h1{font-size:20px;margin:0;font-weight:800}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}.top-actions{display:flex;gap:9px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--green);font-size:18px}.greeting{margin:0 0 18px}.greeting h2{font-size:19px;margin:0 0 4px}.greeting p{color:var(--muted);margin:0;font-size:12px}.balance-card{background:linear-gradient(125deg,#174f43,#236b57);color:white;border-radius:25px;padding:25px 28px;box-shadow:0 15px 35px #174f4325;position:relative;overflow:hidden}.balance-card:after{content:"";position:absolute;width:230px;height:230px;border:1px solid #ffffff18;border-radius:50%;left:-55px;top:-120px;box-shadow:0 0 0 28px #ffffff08,0 0 0 58px #ffffff06}.balance-top{display:flex;justify-content:space-between;align-items:center;color:#d6e6df;font-size:12px}.balance-value{font-size:clamp(28px,5vw,38px);font-weight:800;letter-spacing:.3px;margin:12px 0 3px;direction:ltr;text-align:right}.currency{font-size:11px;color:#d6e6df}.balance-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff25;margin-top:20px;padding-top:13px;font-size:11px;color:#e1eee8}.text-btn{background:none;border:0;color:inherit;font-weight:600}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0}.stat{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:17px 19px;box-shadow:var(--shadow)}.stat-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.stat-icon{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;font-size:16px}.stat strong{display:block;font-size:20px;margin-top:9px;direction:ltr;text-align:right}.stat small{color:var(--muted);font-size:10px}.income .stat-icon{background:#e8f4ed;color:#287b55}.expense .stat-icon{background:#f9ecea;color:var(--red)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel-head h3{margin:0;font-size:14px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:10px}.link{border:0;background:none;color:var(--green2);font-size:11px;font-weight:700}.chart{height:142px;display:flex;align-items:end;justify-content:space-around;gap:12px;padding:8px 5px 0;border-bottom:1px solid var(--line)}.day{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:8px;flex:1}.bars{height:112px;display:flex;align-items:end;gap:4px;width:100%;justify-content:center}.bar{width:min(13px,35%);min-height:3px;border-radius:6px 6px 2px 2px;background:#287b55}.bar.out{background:#d77a70}.day label{font-size:9px;color:var(--muted)}.legend{display:flex;gap:17px;margin-top:13px;color:var(--muted);font-size:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick{border:1px solid var(--line);background:#fbfcfb;border-radius:15px;padding:13px;text-align:right;transition:.2s}.quick:hover{border-color:#b8d1c5;transform:translateY(-2px)}.quick .qicon{width:34px;height:34px;border-radius:11px;background:#eaf2ee;color:var(--green);display:grid;place-items:center;font-size:17px;margin-bottom:9px}.quick b{display:block;font-size:11px}.quick span{display:block;color:var(--muted);font-size:9px;margin-top:3px}.recent{margin-top:16px}.tx-list{display:flex;flex-direction:column}.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line)}.tx-icon{width:38px;height:38px;border-radius:13px;background:#eaf2ee;color:var(--green);display:grid;place-items:center;font-size:16px}.tx-main{flex:1;min-width:0}.tx-main b{display:block;font-size:11px}.tx-main small{color:var(--muted);font-size:9px}.tx-amount{font-weight:700;font-size:12px;direction:ltr;white-space:nowrap}.positive{color:#287b55}.negative{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:11px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px max(16px,calc((100vw - 650px)/2)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.nav{border:0;background:none;color:#87928d;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;min-width:60px}.nav span{font-size:19px}.nav.active{color:var(--green);font-weight:800}.fab{position:fixed;bottom:78px;left:max(22px,calc((100vw - 1060px)/2));width:55px;height:55px;border:0;border-radius:18px;background:var(--gold);color:white;font-size:27px;box-shadow:0 8px 20px #b58a4545;z-index:4}.page-title{font-size:21px;margin:4px 0 5px}.page-sub{font-size:11px;color:var(--muted);margin:0 0 20px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:white;outline:none;margin-bottom:14px}.search:focus,input:focus,select:focus{border-color:#7da995}.account-row,.person-row{display:flex;align-items:center;gap:12px;padding:15px;background:white;border:1px solid var(--line);border-radius:16px;margin-bottom:9px}.avatar{width:40px;height:40px;border-radius:13px;background:#eaf2ee;color:var(--green);display:grid;place-items:center;font-weight:700}.account-row div:nth-child(2),.person-row div:nth-child(2){flex:1}.account-row b,.person-row b{display:block;font-size:12px}.account-row small,.person-row small{color:var(--muted);font-size:10px}.report-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.report-cards .stat{box-shadow:none}.modal-back{position:fixed;inset:0;background:#10251f77;display:none;align-items:end;justify-content:center;z-index:10;padding:15px}.modal-back.show{display:flex}.modal{width:min(100%,480px);background:white;border-radius:24px;padding:22px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0;font-size:17px}.close{border:0;background:#f0f3f1;border-radius:10px;width:34px;height:34px;font-size:18px}.field{display:block;margin:12px 0}.field span{display:block;font-size:11px;font-weight:600;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none}.type-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-options button{border:1px solid var(--line);border-radius:12px;background:white;padding:11px;font-size:11px}.type-options button.selected{border-color:var(--green);background:#edf5f0;color:var(--green);font-weight:700}.submit{width:100%;border:0;border-radius:13px;background:var(--green);color:white;padding:13px;font-weight:700;margin-top:10px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#173f35;color:white;padding:11px 18px;border-radius:12px;z-index:20;font-size:11px;display:none}.toast.show{display:block}
@media(max-width:700px){.app{padding:20px 16px 110px}.top{margin-bottom:22px}.brand h1{font-size:17px}.grid{grid-template-columns:1fr}.balance-card{padding:21px}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:17px}.fab{bottom:78px;left:18px}.panel{padding:16px}}
@media(min-width:701px){.app{padding-bottom:45px}.bottom{position:static;max-width:520px;margin:24px auto 0;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.fab{bottom:35px}.modal-back{align-items:center}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">CIA</div><div><h1>دفتر حساب و کتاب</h1><p>مدیریت ساده و دقیق امور مالی</p></div></div><div class="top-actions"><button class="icon-btn" title="ثبت تراکنش" onclick="openModal()">＋</button><button class="icon-btn" title="جست‌وجو" onclick="go('transactions')">⌕</button></div></header>
<main id="view"></main>
</div>
<button class="fab" onclick="openModal()" aria-label="ثبت تراکنش">＋</button>
<nav class="bottom"><button class="nav active" data-page="home" onclick="go('home')"><span>⌂</span>خانه</button><button class="nav" data-page="people" onclick="go('people')"><span>♙</span>اشخاص</button><button class="nav" data-page="accounts" onclick="go('accounts')"><span>▣</span>حساب‌ها</button><button class="nav" data-page="reports" onclick="go('reports')"><span>▤</span>گزارش‌ها</button></nav>
<div class="modal-back" id="modal" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h3>ثبت تراکنش جدید</h3><button class="close" onclick="closeModal()">×</button></div><form id="txForm"><div class="type-options"><button type="button" class="selected" data-type="income" onclick="setType('income')">＋ دریافتی</button><button type="button" data-type="expense" onclick="setType('expense')">－ پرداختی</button></div><label class="field"><span>مبلغ (تومان)</span><input id="amount" type="number" min="1" required placeholder="مثلاً ۵۰۰۰۰"></label><label class="field"><span>عنوان / طرف‌حساب</span><input id="party" placeholder="اختیاری"></label><label class="field"><span>حساب</span><select id="account"><option>کیف پول</option><option>حساب بانکی</option></select></label><label class="field"><span>تاریخ</span><input id="date" type="date" required></label><label class="field"><span>توضیحات</span><input id="note" placeholder="اختیاری"></label><button class="submit" type="submit">ذخیره تراکنش</button></form></section></div><div class="toast" id="toast"></div>
<script>
const KEY='cia.web.transactions.v1';let transactions=JSON.parse(localStorage.getItem(KEY)||'[]');let page='home',txType='income';
const fmt=n=>new Intl.NumberFormat('fa-IR').format(Math.abs(Number(n)||0));const money=n=>fmt(n)+' تومان';
const faDate=d=>new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'short',day:'numeric'}).format(new Date(d));
function totals(){return transactions.reduce((a,t)=>{a.balance+=(t.type==='income'?1:-1)*t.amount;a[t.type]+=t.amount;return a},{balance:0,income:0,expense:0})}
function txRow(t){return '<div class="tx"><div class="tx-icon">'+(t.type==='income'?'↙':'↗')+'</div><div class="tx-main"><b>'+esc(t.party|| (t.type==='income'?'دریافت وجه':'پرداخت وجه'))+'</b><small>'+esc(t.account)+' · '+faDate(t.date)+'</small></div><div class="tx-amount '+(t.type==='income'?'positive':'negative')+'">'+(t.type==='income'?'+':'−')+fmt(t.amount)+'</div></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){const x=totals();return '<div class="greeting"><h2>سلام، خوش آمدید 👋</h2><p>خلاصه وضعیت مالی شما در یک نگاه</p></div><section class="balance-card"><div class="balance-top"><span>موجودی کل حساب‌ها</span><span>● نمای کلی</span></div><div class="balance-value">'+fmt(x.balance)+'</div><div class="currency">تومان · بر اساس تراکنش‌های ثبت‌شده در این نسخه</div><div class="balance-bottom"><span>گردش مالی ثبت‌شده</span><button class="text-btn" onclick="go(\'accounts\')">مدیریت حساب‌ها ←</button></div></section><div class="stats"><div class="stat income"><div class="stat-head"><span class="stat-icon">↙</span> مجموع دریافتی</div><strong>'+fmt(x.income)+'</strong><small>تومان</small></div><div class="stat expense"><div class="stat-head"><span class="stat-icon">↗</span> مجموع پرداختی</div><strong>'+fmt(x.expense)+'</strong><small>تومان</small></div></div><div class="grid"><section class="panel"><div class="panel-head"><div><h3>روند دخل‌وخرج</h3><p>۷ روز اخیر · بر اساس تراکنش‌های ثبت‌شده</p></div></div>'+chart()+'<div class="legend"><span><i class="dot" style="background:#287b55"></i>دریافت</span><span><i class="dot" style="background:#d77a70"></i>پرداخت</span></div></section><section class="panel"><div class="panel-head"><div><h3>دسترسی سریع</h3><p>بخش موردنظر را انتخاب کنید</p></div></div><div class="quick-grid"><button class="quick" onclick="openModal()"><i class="qicon">＋</i><b>ثبت تراکنش</b><span>دریافت یا پرداخت جدید</span></button><button class="quick" onclick="go('transactions')"><i class="qicon">↔</i><b>تراکنش‌ها</b><span>مشاهده فهرست کامل</span></button><button class="quick" onclick="go('people')"><i class="qicon">♙</i><b>اشخاص</b><span>طرف‌حساب‌ها</span></button><button class="quick" onclick="go('reports')"><i class="qicon">▤</i><b>گزارش‌ها</b><span>خلاصه گردش مالی</span></button></div></section></div><section class="panel recent"><div class="panel-head"><div><h3>آخرین تراکنش‌ها</h3><p>جدیدترین موارد ثبت‌شده</p></div><button class="link" onclick="go(\'transactions\')">مشاهده همه ←</button></div><div class="tx-list">'+(transactions.length?transactions.slice().reverse().slice(0,5).map(txRow).join(''):'<div class="empty">هنوز تراکنشی ثبت نشده است.<br>برای شروع، دکمه + را بزنید.</div>')+'</div></section>'}
function chart(){const now=new Date(),days=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()-6+i);const key=d.toISOString().slice(0,10);const list=transactions.filter(t=>t.date===key);return{label:new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(d),income:list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense:list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)}});const max=Math.max(1,...days.flatMap(d=>[d.income,d.expense]));return '<div class="chart">'+days.map(d=>'<div class="day"><div class="bars"><i class="bar" style="height:'+Math.max(3,d.income/max*100)+'%"></i><i class="bar out" style="height:'+Math.max(3,d.expense/max*100)+'%"></i></div><label>'+d.label+'</label></div>').join('')+'</div>'}
function transactionsPage(){return '<h2 class="page-title">تراکنش‌ها</h2><p class="page-sub">همه دریافت‌ها و پرداخت‌های ثبت‌شده</p><input class="search" id="filter" placeholder="جست‌وجو در عنوان و طرف‌حساب..." oninput="filterTx(this.value)"><div class="panel"><div class="tx-list" id="txlist">'+(transactions.length?transactions.slice().reverse().map(txRow).join(''):'<div class="empty">هنوز تراکنشی ثبت نشده است.</div>')+'</div></div>'}
function peoplePage(){const names=[...new Set(transactions.map(t=>t.party).filter(Boolean))];return '<h2 class="page-title">اشخاص</h2><p class="page-sub">طرف‌حساب‌هایی که در تراکنش‌ها ثبت کرده‌اید</p><div>'+(names.length?names.map(n=>{const sum=transactions.filter(t=>t.party===n).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);return '<div class="person-row"><div class="avatar">'+esc(n.trim().charAt(0))+'</div><div><b>'+esc(n)+'</b><small>'+transactions.filter(t=>t.party===n).length+' تراکنش</small></div><strong class="'+(sum>=0?'positive':'negative')+'">'+fmt(sum)+'</strong></div>'}).join(''):'<div class="panel empty">هنوز طرف‌حساب ثبت نشده است.<br>هنگام ثبت تراکنش می‌توانید نام شخص را وارد کنید.</div>')+'</div>'}
function accountsPage(){const names=['کیف پول','حساب بانکی'];return '<h2 class="page-title">حساب‌ها</h2><p class="page-sub">نمای کلی حساب‌های قابل استفاده در نسخه وب</p>'+names.map((n,i)=>{const sum=transactions.filter(t=>t.account===n).reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);return '<div class="account-row"><div class="avatar">'+(i?'▣':'◉')+'</div><div><b>'+n+'</b><small>حاصل تراکنش‌های ثبت‌شده</small></div><strong>'+money(sum)+'</strong></div>'}).join('')}
function reportsPage(){const x=totals(),net=x.income-x.expense;return '<h2 class="page-title">گزارش‌ها</h2><p class="page-sub">خلاصه عملکرد مالی بر اساس داده‌های همین نسخه وب</p><div class="report-cards"><div class="stat income"><div class="stat-head">کل دریافتی</div><strong>'+fmt(x.income)+'</strong><small>تومان</small></div><div class="stat expense"><div class="stat-head">کل پرداختی</div><strong>'+fmt(x.expense)+'</strong><small>تومان</small></div><div class="stat"><div class="stat-head">خالص گردش</div><strong class="'+(net>=0?'positive':'negative')+'">'+fmt(net)+'</strong><small>تومان</small></div><div class="stat"><div class="stat-head">تعداد تراکنش</div><strong>'+fmt(transactions.length)+'</strong><small>مورد</small></div></div><section class="panel recent"><div class="panel-head"><h3>آخرین فعالیت‌ها</h3></div><div class="tx-list">'+(transactions.slice().reverse().slice(0,10).map(txRow).join('')||'<div class="empty">داده‌ای برای گزارش وجود ندارد.</div>')+'</div></section>'}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('view').innerHTML=({home,transactions:transactionsPage,people:peoplePage,accounts:accountsPage,reports:reportsPage}[p]||home)();document.querySelector('.fab').style.display=p==='home'?'block':'none';}
function openModal(){document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function setType(t){txType=t;document.querySelectorAll('.type-options button').forEach(b=>b.classList.toggle('selected',b.dataset.type===t))}
document.getElementById('txForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number(document.getElementById('amount').value);if(!amount||amount<1)return;transactions.push({id:Date.now(),type:txType,amount,party:document.getElementById('party').value.trim(),account:document.getElementById('account').value,date:document.getElementById('date').value,note:document.getElementById('note').value.trim()});localStorage.setItem(KEY,JSON.stringify(transactions));e.target.reset();closeModal();go(page);toast('تراکنش با موفقیت ثبت شد')});
function filterTx(q){const el=document.getElementById('txlist');if(!el)return;const found=transactions.slice().reverse().filter(t=>(t.party+' '+t.account+' '+t.note).toLowerCase().includes(q.toLowerCase()));el.innerHTML=found.map(txRow).join('')||'<div class="empty">موردی پیدا نشد.</div>'}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
go('home');
</script>
</body></html>
