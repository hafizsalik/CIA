.ref-tx-row:first-child{border-radius:12px 12px 0 0}.ref-tx-row:last-child{border-radius:0 0 12px 12px}
.ref-tx-date{font-size:10px;color:#707070;line-height:2;white-space:nowrap}
.ref-tx-info{text-align:right;min-width:0}.ref-tx-info b{display:block;font-size:12px;font-weight:600;overflow-wrap:anywhere}.ref-tx-info small{display:block;color:#707070;font-size:10px;margin-top:7px}

.type-picker-back{position:fixed;inset:0;background:#0008;display:none;align-items:end;justify-content:center;z-index:11;padding:0}.type-picker-back.show{display:flex}.type-picker{width:min(100%,591px);background:#fff;border-radius:42px 42px 0 0;padding:62px 13.5% calc(25px + env(safe-area-inset-bottom));box-shadow:0 -3px 18px #0002}.type-picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 30px}.type-picker-grid button{height:94px;border:0;border-radius:44px;color:#fff;font-size:clamp(15px,4vw,20px);font-weight:800}.pick-expense{background:#fc3030}.pick-income{background:#145c01}@media(min-width:701px){.type-picker-back{align-items:center;padding:20px}.type-picker{border-radius:30px;padding:35px;max-width:520px}.type-picker-grid{gap:14px 22px}}
/* New party form — follows supplied reference */
.party-page{max-width:760px;margin:0 auto;background:#f5f5f5;min-height:calc(100vh - 30px);padding-bottom:34px}
.party-head{height:138px;background:#152f8c;color:#fff;display:flex;align-items:flex-start;padding:34px 25px;gap:15px}

.party-contacts span{display:grid;place-items:center}.party-contacts .ui-icon{width:26px;height:26px}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">CIA</div><div><h1>دفتر حساب و کتاب</h1><p>مدیریت ساده و دقیق امور مالی</p></div></div><div class="top-actions"><button class="icon-btn" title="ثبت تراکنش" aria-label="ثبت تراکنش" onclick="openTypePicker()"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="icon-btn" title="جست‌وجو" aria-label="جست‌وجو" onclick="go('transactions')"><svg class="ui-icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button></div></header>
<main id="view"></main>
</div>
<button class="fab" onclick="openTypePicker()" aria-label="ثبت تراکنش"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottom"><button class="nav active" data-page="home" onclick="go('home')"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-6h6v6"/></svg>خانه</button><button class="nav" data-page="people" onclick="go('people')"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M18 8a3 3 0 0 1 0 6m1 2a5 5 0 0 1 3 5"/></svg>اشخاص</button><button class="nav" data-page="accounts" onclick="go('accounts')"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2"/></svg>حساب‌ها</button><button class="nav" data-page="reports" onclick="go('reports')"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4h16v16zM8 8h8M8 12h8M8 16h5"/></svg>گزارش‌ها</button></nav>
<div class="type-picker-back" id="typePicker" onclick="if(event.target===this)closeTypePicker()"><section class="type-picker"><div class="type-picker-grid"><button class="pick-expense" onclick="chooseType('پول دادم')">پول دادم</button><button class="pick-income" onclick="chooseType('پول گرفتم')">پول گرفتم</button><button class="pick-expense" onclick="chooseType('خرج کردم')">خرج کردم</button><button class="pick-income" onclick="chooseType('هزینه کردم')">هزینه کردم</button><button class="pick-expense" onclick="chooseType('هدیه دادم')">هدیه دادم</button><button class="pick-income" onclick="chooseType('هدیه گرفتم')">هدیه گرفتم</button></div></section></div>
<div class="modal-back" id="modal" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h3 id="modalTitle">ثبت تراکنش جدید</h3><button class="close" onclick="closeModal()">×</button></div><form id="txForm">
<label class="field"><span>مبلغ (تومان)</span><input id="amount" type="number" min="1" step="1" required placeholder="مبلغ را وارد کنید"></label>
<label class="field"><span>طرف‌حساب</span><input id="party" placeholder="نام شخص یا مجموعه"></label>
<label class="field" id="noPartyWrap" style="display:none"><span><input id="noParty" type="checkbox" style="width:auto"> بدون طرف‌حساب ثبت شود</span></label>
<label class="field"><span>حساب</span><select id="account"><option>کیف پول</option><option>حساب بانکی</option></select></label>
<label class="field"><span>دسته‌بندی (اختیاری)</span><input id="category" placeholder="مثلاً خوراک، رفت‌وآمد"></label>
<label class="field"><span>تاریخ</span><input id="date" type="date" required></label>
<label class="field"><span>ساعت</span><input id="time" type="time" required></label>
<label class="field"><span>توضیحات (اختیاری)</span><input id="note" placeholder="توضیحات بیشتر"></label>
<button class="submit" type="submit">ذخیره تراکنش</button></form></section></div><div class="modal-back" id="accountModal" onclick="if(event.target===this)closeAccountModal()"><section class="modal"><div class="modal-head"><h3>حساب جدید</h3><button class="close" onclick="closeAccountModal()">×</button></div><form id="accountForm"><label class="field"><span>نام حساب</span><input id="accountName" required maxlength="60" placeholder="مثلاً بانک ملت"></label><label class="field"><span>موجودی اولیه (تومان)</span><input id="accountOpening" type="number" min="0" step="1" value="0" required></label><button class="submit" type="submit">ثبت حساب</button></form></section></div><div class="toast" id="toast"></div>
<script>
const KEY='cia.web.transactions.v1';let transactions=JSON.parse(localStorage.getItem(KEY)||'[]');let page='home',txType='income';
const fmt=n=>new Intl.NumberFormat('fa-IR').format(Math.abs(Number(n)||0));const money=n=>fmt(n)+' تومان';
const faDate=d=>new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'short',day:'numeric'}).format(new Date(d));
function partyNet(t){if(t.kind==='پول دادم'||t.kind==='قرض دادم')return Number(t.amount)||0;if(t.kind==='پول گرفتم'||t.kind==='قرض گرفتم')return -(Number(t.amount)||0);return t.kind?0:(t.type==='expense'?(Number(t.amount)||0):-(Number(t.amount)||0))}\nfunction totals(){return transactions.reduce((a,t)=>{a.balance+=(t.type==='income'?1:-1)*t.amount;a[t.type]+=t.amount;return a},{balance:0,income:0,expense:0})}
function txRow(t){return '<div class="tx"><div class="tx-icon">'+(t.type==='income'?'↙':'↗')+'</div><div class="tx-main"><b>'+esc(t.party|| (t.type==='income'?'دریافت وجه':'پرداخت وجه'))+'</b><small>'+esc(t.account)+' · '+faDate(t.date)+'</small></div><div class="tx-amount '+(t.type==='income'?'positive':'negative')+'">'+(t.type==='income'?'+':'−')+fmt(t.amount)+'</div></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let homeInnerTab='people',homePeriod='all';let selectedKind='پول گرفتم';
function home(){
 const list=periodTransactions();
 const names=[...new Set(list.map(t=>t.party).filter(Boolean))];
 const rows=names.map(name=>{const items=list.filter(t=>t.party===name);const net=items.reduce((s,t)=>s+partyNet(t),0);return{name,items,net}});
 const positive=rows.filter(r=>r.net>=0).reduce((s,r)=>s+r.net,0);
 const negative=rows.filter(r=>r.net<0).reduce((s,r)=>s+Math.abs(r.net),0);
 const accountTotal=totals().balance;
 return '<section class="ref-home"><div class="ref-head"><div class="ref-brand"><div class="ref-logo">CIA</div><div><h2>دفتر حساب و کتاب</h2><small>برای تغییر دفتر حساب کلیک کنید</small></div><div class="ref-actions"><button onclick="go(\'reports\')" title="تنظیمات">⚙</button><button onclick="go(\'transactions\')" title="پیام‌ها">▤</button></div></div><div class="period-row"><span style="font-size:10px">بازه:</span><button class="'+(homePeriod==='all'?'active':'')+'" onclick="setHomePeriod(\'all\')">مانده</button><button class="'+(homePeriod==='month'?'active':'')+'" onclick="setHomePeriod(\'month\')">ماه جاری</button><button class="'+(homePeriod==='today'?'active':'')+'" onclick="setHomePeriod(\'today\')">امروز</button></div><div class="ref-tabs"><button class="'+(homeInnerTab==='people'?'active':'')+'" onclick="setHomeTab(\'people\')">طرف‌حساب‌ها</button><button class="'+(homeInnerTab==='transactions'?'active':'')+'" onclick="setHomeTab(\'transactions\')">تراکنش‌ها</button></div><div class="ref-status"><div class="muted">وضعیت مانده طرف‌حساب‌ها</div><div class="ref-status-grid"><div><span class="owed">مانده مثبت</span><strong>'+fmt(positive)+' تومان</strong></div><div style="text-align:left"><span class="due">مانده منفی</span><strong>'+fmt(negative)+' تومان</strong></div></div></div></div><div class="ref-content"><button class="live-account" onclick="go(\'accounts\')"><b>مشاهده صورت‌حساب‌های زنده</b><small>موجودی حساب‌ها: '+fmt(accountTotal)+' تومان · '+transactionsAccountCount()+' حساب</small></button>'+(homeInnerTab==='people'?'<div class="ref-list-head"><span>'+fmt(rows.length)+' طرف‌حساب</span><button class="link" onclick="go(\'people\')">مشاهده فهرست</button></div><input class="ref-search" id="partySearch" placeholder="جستجوی نام و شماره" oninput="filterHomePeople(this.value)"><div id="homePeople">'+(rows.length?rows.map(personRow).join(''):'<div class="panel empty">هنوز طرف‌حسابی ثبت نشده است.<br>نام طرف‌حساب را هنگام ثبت تراکنش وارد کنید.</div>')+'</div>':'<div class="ref-list-head"><b>تراکنش‌های این بازه</b><span>'+fmt(list.length)+' مورد</span></div><input class="ref-tx-search" id="homeTxSearch" placeholder="جستجوی نام، توضیحات و طرف‌حساب" oninput="filterHomeTransactions(this.value)"><div id="homeTxRows">'+(list.length?list.slice().reverse().map(referenceTxRow).join(''):'<div class="empty">تراکنشی در این بازه ثبت نشده است.</div>')+'</div>')+'<div class="ref-actions-bottom"><button class="ref-primary" onclick="go(\'people\')">طرف‌حساب‌ها</button><button class="ref-secondary" onclick="openTypePicker()">＋ ثبت تراکنش جدید</button></div></div></section>';
}
function personRow(r){return '<div class="ref-person" data-party="'+esc(r.name).toLowerCase()+'"><div class="ref-avatar">'+esc(r.name.trim().charAt(0))+'</div><div class="ref-person-main"><b>'+esc(r.name)+'</b><small>'+fmt(r.items.length)+' تراکنش</small></div><div class="ref-person-value"><strong class="'+(r.net>=0?'owed':'due')+'">'+fmt(r.net)+' تومان</strong><small>'+(r.net>=0?'مانده مثبت':'مانده منفی')+'</small></div></div>'}
function referenceTxRow(t){const title=t.party||t.note|| (t.type==='income'?'دریافت وجه':'پرداخت وجه');const detail=t.note&&t.party?t.note:(t.account||'');const date=new Date(t.date+'T00:00:00');const time=t.time||'';return '<div class="ref-tx-row" data-tx-search="'+esc([title,detail,t.type,t.account].join(' ').toLowerCase())+'"><div class="ref-tx-date">'+(time?esc(time)+'<br>':'')+faDate(t.date)+'</div><div class="ref-tx-info"><b>'+esc(title)+'</b><small>'+esc(detail||t.type)+'</small></div><div class="ref-tx-amount '+(t.type==='income'?'positive':'negative')+'">'+(t.type==='income'?'+':'−')+fmt(t.amount)+'<small>'+(t.type==='income'?'دریافت کردم':'پرداخت کردم')+'</small></div></div>'}
function filterHomeTransactions(q){document.querySelectorAll('#homeTxRows .ref-tx-row').forEach(el=>el.style.display=el.dataset.txSearch.includes(q.toLowerCase())?'grid':'none')}
function transactionsAccountCount(){return [...new Set(transactions.map(t=>t.account))].length}
function periodTransactions(){const now=new Date();return transactions.filter(t=>{const d=new Date(t.date+'T00:00:00');if(homePeriod==='today')return d.toDateString()===now.toDateString();if(homePeriod==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();return true})}
function setHomePeriod(p){homePeriod=p;go('home')}
function setHomeTab(t){homeInnerTab=t;go('home')}
function filterHomePeople(q){document.querySelectorAll('#homePeople .ref-person').forEach(el=>el.style.display=el.dataset.party.includes(q.toLowerCase())?'flex':'none')}

function chart(){const now=new Date(),days=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()-6+i);const key=d.toISOString().slice(0,10);const list=transactions.filter(t=>t.date===key);return{label:new Intl.DateTimeFormat('fa-IR',{weekday:'short'}).format(d),income:list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),expense:list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)}});const max=Math.max(1,...days.flatMap(d=>[d.income,d.expense]));return '<div class="chart">'+days.map(d=>'<div class="day"><div class="bars"><i class="bar" style="height:'+Math.max(3,d.income/max*100)+'%"></i><i class="bar out" style="height:'+Math.max(3,d.expense/max*100)+'%"></i></div><label>'+d.label+'</label></div>').join('')+'</div>'}
function transactionsPage(){return '<h2 class="page-title">تراکنش‌ها</h2><p class="page-sub">همه دریافت‌ها و پرداخت‌های ثبت‌شده</p><input class="search" id="filter" placeholder="جست‌وجو در عنوان و طرف‌حساب..." oninput="filterTx(this.value)"><div class="panel"><div class="tx-list" id="txlist">'+(transactions.length?transactions.slice().reverse().map(txRow).join(''):'<div class="empty">هنوز تراکنشی ثبت نشده است.</div>')+'</div></div>'}
const PARTY_KEY='cia.web.parties.v1';let parties=JSON.parse(localStorage.getItem(PARTY_KEY)||'[]');let partyFormOpen=false;\nconst ACCOUNT_KEY='cia.web.accounts.v1';let accounts=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'null')||[{id:'cash',name:'کیف پول',openingBalance:0},{id:'bank',name:'حساب بانکی',openingBalance:0}];
function peoplePage(){const names=[...new Set([...parties.map(p=>p.name),...transactions.map(t=>t.party).filter(Boolean)])];if(partyFormOpen)return partyFormPage();return '<h2 class="page-title">اشخاص</h2><p class="page-sub">فهرست طرف‌حساب‌ها</p><button class="submit" style="max-width:230px;margin:0 0 16px" onclick="openPartyForm()">＋ طرف حساب جدید</button><div>'+(names.length?names.map(n=>{const sum=transactions.filter(t=>t.party===n).reduce((s,t)=>s+partyNet(t),0);return '<div class="person-row"><div class="avatar">'+esc(n.trim().charAt(0))+'</div><div><b>'+esc(n)+'</b><small>'+transactions.filter(t=>t.party===n).length+' تراکنش</small></div><strong class="'+(sum>=0?'positive':'negative')+'">'+fmt(sum)+'</strong></div>'}).join(''):'<div class="panel empty">هنوز طرف‌حسابی ثبت نشده است.</div>')+'</div>'}
function partyFormPage(){return '<section class="party-page"><header class="party-head"><button class="party-back" onclick="closePartyForm()" aria-label="بازگشت"><svg class="ui-icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><h2>طرف حساب جدید</h2></header><form id="partyForm" onsubmit="saveParty(event)"><div class="party-form"><div class="party-field"><button type="button" class="party-contacts" onclick="toast(\'دسترسی به مخاطبان دستگاه در نسخه وب فعال نیست\')"><span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5.5 17a3.5 3.5 0 0 1 7 0M15 9h3M15 13h3"/></svg></span>مخاطبان</button><input id="partyName" placeholder="نام و نام خانوادگی" required maxlength="120"></div><div class="party-field"><input id="partyPhone" type="tel" placeholder="شماره تماس" required maxlength="20"></div><div class="party-field"><input id="partyNational" inputmode="numeric" placeholder="کد ملی (اختیاری)" maxlength="20"></div><div class="party-field"><input id="partyPostal" inputmode="numeric" placeholder="کد پستی (اختیاری)" maxlength="20"></div><div class="party-field"><textarea id="partyNote" placeholder="توضیحات"></textarea></div></div><button class="party-save" type="submit">ثبت طرف حساب</button></form></section>'}
function openPartyForm(){partyFormOpen=true;go('people')}
function closePartyForm(){partyFormOpen=false;go('people')}
function saveParty(e){e.preventDefault();const name=document.getElementById('partyName').value.trim(),phone=document.getElementById('partyPhone').value.trim();if(!name||!phone){toast('نام و شماره تماس را وارد کنید');return}if(parties.some(p=>p.phone===phone)){toast('این شماره تماس قبلاً ثبت شده است');return}parties.push({id:Date.now(),name,phone,nationalCode:document.getElementById('partyNational').value.trim(),postalCode:document.getElementById('partyPostal').value.trim(),description:document.getElementById('partyNote').value.trim()});localStorage.setItem(PARTY_KEY,JSON.stringify(parties));partyFormOpen=false;go('people');toast('طرف‌حساب با موفقیت ثبت شد')}
function accountBalance(a){return Number(a.openingBalance||0)+transactions.filter(t=>t.account===a.name).reduce((s,t)=>s+(t.type==='income'?Number(t.amount):-Number(t.amount)),0)}
function accountsPage(){return '<h2 class="page-title">حساب‌ها</h2><p class="page-sub">مدیریت کیف پول و حساب‌های بانکی</p><button class="submit" style="max-width:220px;margin:0 0 16px" onclick="openAccountModal()">＋ افزودن حساب</button>'+accounts.map(a=>'<div class="account-row"><div class="avatar"><svg class="ui-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2"/></svg></div><div><b>'+esc(a.name)+'</b><small>موجودی اولیه: '+fmt(a.openingBalance)+' تومان</small></div><strong>'+money(accountBalance(a))+'</strong></div>').join('')+'<div class="panel empty">برای ثبت تراکنش، حساب موردنظر را از فرم ثبت انتخاب کنید.</div>'}
function openAccountModal(){document.getElementById('accountModal').classList.add('show')}
function closeAccountModal(){document.getElementById('accountModal').classList.remove('show')}
document.getElementById('accountForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('accountName').value.trim(),opening=Number(document.getElementById('accountOpening').value);if(!name||!Number.isSafeInteger(opening)||opening<0){toast('اطلاعات حساب معتبر نیست');return}if(accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){toast('این حساب قبلاً ثبت شده است');return}accounts.push({id:'a'+Date.now(),name,openingBalance:opening});localStorage.setItem(ACCOUNT_KEY,JSON.stringify(accounts));e.target.reset();closeAccountModal();syncAccountOptions();go('accounts');toast('حساب با موفقیت ثبت شد')});
function syncAccountOptions(){const select=document.getElementById('account');if(!select)return;const selected=select.value;select.innerHTML=accounts.map(a=>'<option>'+esc(a.name)+'</option>').join('');if(accounts.some(a=>a.name===selected))select.value=selected}

function reportsPage(){const x=totals(),net=x.income-x.expense;return '<h2 class="page-title">گزارش‌ها</h2><p class="page-sub">خلاصه عملکرد مالی بر اساس داده‌های همین نسخه وب</p><div class="report-cards"><div class="stat income"><div class="stat-head">کل دریافتی</div><strong>'+fmt(x.income)+'</strong><small>تومان</small></div><div class="stat expense"><div class="stat-head">کل پرداختی</div><strong>'+fmt(x.expense)+'</strong><small>تومان</small></div><div class="stat"><div class="stat-head">خالص گردش</div><strong class="'+(net>=0?'positive':'negative')+'">'+fmt(net)+'</strong><small>تومان</small></div><div class="stat"><div class="stat-head">تعداد تراکنش</div><strong>'+fmt(transactions.length)+'</strong><small>مورد</small></div></div><section class="panel recent"><div class="panel-head"><h3>آخرین فعالیت‌ها</h3></div><div class="tx-list">'+(transactions.slice().reverse().slice(0,10).map(txRow).join('')||'<div class="empty">داده‌ای برای گزارش وجود ندارد.</div>')+'</div></section>'}
function go(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('view').innerHTML=({home,transactions:transactionsPage,people:peoplePage,accounts:accountsPage,reports:reportsPage}[p]||home)();document.querySelector('.fab').style.display=p==='home'?'block':'none';}
function openTypePicker(){document.getElementById('typePicker').classList.add('show')}
function closeTypePicker(){document.getElementById('typePicker').classList.remove('show')}
function chooseType(kind){syncAccountOptions();
 selectedKind=kind;txType=['پول گرفتم','هدیه گرفتم'].includes(kind)?'income':'expense';closeTypePicker();
 document.getElementById('modalTitle').textContent=kind;
 const now=new Date();document.getElementById('date').value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
 document.getElementById('time').value=now.toTimeString().slice(0,5);
 const requiredParty=['پول گرفتم','پول دادم'].includes(kind);document.getElementById('party').required=requiredParty;
 document.getElementById('noPartyWrap').style.display=requiredParty?'block':'none';document.getElementById('noParty').checked=false;
 document.getElementById('modal').classList.add('show')
}
function openModal(){openTypePicker()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function setType(t){txType=t}
document.getElementById('txForm').addEventListener('submit',e=>{
 e.preventDefault();const amount=Number(document.getElementById('amount').value),party=document.getElementById('party').value.trim(),requiredParty=['پول گرفتم','پول دادم'].includes(selectedKind);
 if(!Number.isSafeInteger(amount)||amount<1){toast('مبلغ معتبر وارد کنید');return}
 if(requiredParty&&!party&&!document.getElementById('noParty').checked){toast('طرف‌حساب را وارد کنید یا بدون طرف‌حساب را انتخاب کنید');return}
 const date=document.getElementById('date').value,time=document.getElementById('time').value;if(!date||!time){toast('تاریخ و ساعت را کامل کنید');return}
 transactions.push({id:Date.now(),type:txType,kind:selectedKind,amount,party,account:document.getElementById('account').value,date,time,category:document.getElementById('category').value.trim(),note:document.getElementById('note').value.trim()});
 localStorage.setItem(KEY,JSON.stringify(transactions));e.target.reset();closeModal();go(page);toast('تراکنش با موفقیت ثبت شد')
});
function filterTx(q){const el=document.getElementById('txlist');if(!el)return;const found=transactions.slice().reverse().filter(t=>(t.party+' '+t.account+' '+t.note).toLowerCase().includes(q.toLowerCase()));el.innerHTML=found.map(txRow).join('')||'<div class="empty">موردی پیدا نشد.</div>'}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
syncAccountOptions();go('home');
</script>
</body></html>
