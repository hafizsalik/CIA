<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="صفحه اصلی پروژه CIA">
  <title>CIA | صفحه اصلی</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      width: min(100%, 720px);
      padding: 48px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e9f2;
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(20, 35, 60, .08);
    }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 5vw, 3rem); }
    p { margin: 0; color: #5d6678; line-height: 1.9; }
  </style>
</head>
<body>
  <main>
    <h1>به CIA خوش آمدید</h1>
    <p>این صفحهٔ آغازین پروژه است. محتوای اصلی را می‌توان در ادامه به آن افزود.</p>
  </main>
</body>
</html>
